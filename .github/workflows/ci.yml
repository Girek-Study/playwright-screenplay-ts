name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  calidad:
    name: Tipos y estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .

  pruebas:
    name: Pruebas (${{ matrix.navegador }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Un navegador roto no debe ocultar el resultado de los otros dos.
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps ${{ matrix.navegador }}

      - name: Ejecutar la suite
        run: npx playwright test --project=${{ matrix.navegador }}

      - name: Publicar el reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: reporte-${{ matrix.navegador }}
          path: playwright-report/
          retention-days: 14
